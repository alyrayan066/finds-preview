name: Publish Finds on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract the site bundle
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil, zipfile
          with zipfile.ZipFile('finds-site.zip') as bundle:
              for entry in bundle.infolist():
                  rel = PurePosixPath(entry.filename.replace(chr(92), '/'))
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'Unsafe bundle path: {entry.filename}')
                  target = Path('_site').joinpath(*rel.parts)
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(entry) as source, target.open('wb') as dest:
                      shutil.copyfileobj(source, dest)
          if not Path('_site/index.html').is_file():
              raise SystemExit('index.html missing from site bundle')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
